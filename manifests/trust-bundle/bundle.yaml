# The demo CA's certificate in a ConfigMap called demo-ca in every namespace (key ca.crt), kept current by trust-manager.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: demo-ca
spec:
  sources:
    - secret:
        name: demo-ca
        key: ca.crt
  target:
    configMap:
      key: ca.crt
