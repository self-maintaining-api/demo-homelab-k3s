# A secret store with fixed values (External Secrets' "fake" provider), so the demo needs no cloud account.
# Change a value here and merge: External Secrets updates the Secret, Reloader restarts podinfo.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: demo-values
spec:
  provider:
    fake:
      data:
        - key: /demo-app/message
          value: "Hello from External Secrets"
        - key: /demo-app/api-token
          value: "not-a-real-token"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: podinfo-config
  namespace: demo-app
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: demo-values
  target:
    name: podinfo-config
  data:
    - secretKey: PODINFO_UI_MESSAGE
      remoteRef:
        key: /demo-app/message
    - secretKey: API_TOKEN
      remoteRef:
        key: /demo-app/api-token
