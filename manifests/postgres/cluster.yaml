apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: demo-db
  namespace: demo-db
spec:
  instances: 1
  storage:
    size: 2Gi # k3s' local-path storage on the VM disk
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi
  postgresql:
    parameters:  # sized for a demo: the defaults assume a whole machine
      shared_buffers: 64MB
      max_connections: "30"
      effective_cache_size: 192MB
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: app
      owner: app
