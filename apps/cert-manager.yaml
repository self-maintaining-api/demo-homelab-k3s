# Every option of the cert-manager chart is set below, at the default of the version these values were written for
# (tools/chart-defaults/cert-manager.yaml; image tags left to the chart), so release notes about any of them match
# this repository. 14 of the settings are this repository's own choices: see tools/gen_apps.py.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    notifications.argoproj.io/subscribe.on-upgrade-healthy.slack: ""
    notifications.argoproj.io/subscribe.on-upgrade-degraded.slack: ""
    notifications.argoproj.io/subscribe.on-upgrade-failed.slack: ""
    notifications.argoproj.io/subscribe.on-upgrade-stuck.slack: ""
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.18.6
    helm:
      valuesObject:
        global:
          imagePullSecrets: []
          commonLabels: {}
          priorityClassName: ''
          rbac:
            create: true
            aggregateClusterRoles: true
          podSecurityPolicy:
            enabled: false
            useAppArmor: true
          logLevel: 2
          leaderElection:
            namespace: kube-system
        installCRDs: false
        crds:
          enabled: true
          keep: true
        replicaCount: 1
        strategy: {}
        podDisruptionBudget:
          enabled: false
        featureGates: ''
        maxConcurrentChallenges: 60
        image:
          repository: quay.io/jetstack/cert-manager-controller
          pullPolicy: IfNotPresent
        clusterResourceNamespace: ''
        namespace: ''
        serviceAccount:
          create: true
          automountServiceAccountToken: true
        enableCertificateOwnerRef: true
        config: {}
        dns01RecursiveNameservers: ''
        dns01RecursiveNameserversOnly: false
        disableAutoApproval: false
        approveSignerNames:
        - issuers.cert-manager.io/*
        - clusterissuers.cert-manager.io/*
        extraArgs: []
        extraEnv: []
        resources:
          requests:
            cpu: 5m
            memory: 48Mi
          limits:
            memory: 160Mi
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumes: []
        volumeMounts: []
        podLabels: {}
        hostAliases: []
        nodeSelector:
          kubernetes.io/os: linux
        ingressShim: {}
        affinity: {}
        tolerations: []
        topologySpreadConstraints: []
        livenessProbe:
          enabled: true
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 15
          successThreshold: 1
          failureThreshold: 8
        enableServiceLinks: false
        prometheus:
          enabled: true
          servicemonitor:
            enabled: false
            prometheusInstance: default
            targetPort: http-metrics
            path: /metrics
            interval: 60s
            scrapeTimeout: 30s
            labels: {}
            annotations: {}
            honorLabels: false
            endpointAdditionalProperties: {}
          podmonitor:
            enabled: false
            prometheusInstance: default
            path: /metrics
            interval: 60s
            scrapeTimeout: 30s
            labels: {}
            annotations: {}
            honorLabels: false
            endpointAdditionalProperties: {}
        webhook:
          replicaCount: 1
          timeoutSeconds: 30
          config: {}
          strategy: {}
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containerSecurityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          podDisruptionBudget:
            enabled: false
          validatingWebhookConfiguration:
            namespaceSelector:
              matchExpressions:
              - key: cert-manager.io/disable-validation
                operator: NotIn
                values:
                - 'true'
          mutatingWebhookConfiguration:
            namespaceSelector: {}
          extraArgs: []
          extraEnv: []
          featureGates: ''
          resources:
            requests:
              cpu: 5m
              memory: 24Mi
            limits:
              memory: 96Mi
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 60
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 1
          nodeSelector:
            kubernetes.io/os: linux
          affinity: {}
          tolerations: []
          topologySpreadConstraints: []
          podLabels: {}
          serviceLabels: {}
          serviceIPFamilyPolicy: ''
          serviceIPFamilies: []
          image:
            repository: quay.io/jetstack/cert-manager-webhook
            pullPolicy: IfNotPresent
          serviceAccount:
            create: true
            automountServiceAccountToken: true
          securePort: 10250
          hostNetwork: false
          serviceType: ClusterIP
          url: {}
          networkPolicy:
            enabled: false
            ingress:
            - from:
              - ipBlock:
                  cidr: 0.0.0.0/0
            egress:
            - ports:
              - port: 80
                protocol: TCP
              - port: 443
                protocol: TCP
              - port: 53
                protocol: TCP
              - port: 53
                protocol: UDP
              - port: 6443
                protocol: TCP
              to:
              - ipBlock:
                  cidr: 0.0.0.0/0
          volumes: []
          volumeMounts: []
          enableServiceLinks: false
        cainjector:
          enabled: true
          replicaCount: 1
          config: {}
          strategy: {}
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containerSecurityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          podDisruptionBudget:
            enabled: false
          extraArgs: []
          extraEnv: []
          featureGates: ''
          resources:
            requests:
              cpu: 5m
              memory: 48Mi
            limits:
              memory: 192Mi
          nodeSelector:
            kubernetes.io/os: linux
          affinity: {}
          tolerations: []
          topologySpreadConstraints: []
          podLabels: {}
          serviceLabels: {}
          image:
            repository: quay.io/jetstack/cert-manager-cainjector
            pullPolicy: IfNotPresent
          serviceAccount:
            create: true
            automountServiceAccountToken: true
          volumes: []
          volumeMounts: []
          enableServiceLinks: false
        acmesolver:
          image:
            repository: quay.io/jetstack/cert-manager-acmesolver
            pullPolicy: IfNotPresent
        startupapicheck:
          enabled: true
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containerSecurityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          timeout: 1m
          backoffLimit: 4
          jobAnnotations:
            helm.sh/hook: post-install
            helm.sh/hook-weight: '1'
            helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
          extraArgs:
          - -v
          extraEnv: []
          resources: {}
          nodeSelector:
            kubernetes.io/os: linux
          affinity: {}
          tolerations: []
          podLabels: {}
          image:
            repository: quay.io/jetstack/cert-manager-startupapicheck
            pullPolicy: IfNotPresent
          rbac:
            annotations:
              helm.sh/hook: post-install
              helm.sh/hook-weight: '-5'
              helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
          serviceAccount:
            create: true
            annotations:
              helm.sh/hook: post-install
              helm.sh/hook-weight: '-5'
              helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
            automountServiceAccountToken: true
          volumes: []
          volumeMounts: []
          enableServiceLinks: false
        extraObjects: []
        creator: helm
        enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
