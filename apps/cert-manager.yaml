apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.18.6
    helm:
      valuesObject:
        crds:
          enabled: true
          keep: true
        enableCertificateOwnerRef: true  # deleting a Certificate deletes its Secret
        prometheus:
          enabled: true  # metrics, scraped through the service's prometheus.io annotations
          servicemonitor:
            enabled: false
        resources:
          requests:
            cpu: 5m
            memory: 48Mi
          limits:
            memory: 160Mi
        webhook:
          resources:
            requests:
              cpu: 5m
              memory: 24Mi
            limits:
              memory: 96Mi
        cainjector:
          resources:
            requests:
              cpu: 5m
              memory: 48Mi
            limits:
              memory: 192Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
