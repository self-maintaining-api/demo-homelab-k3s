# k3s' built-in metrics-server is turned off (scripts/vm-bootstrap.sh) so this chart owns it.
# Every option of the metrics-server chart is set below, at the default of the version these values were written for
# (tools/chart-defaults/metrics-server.yaml; images left to the chart), so release notes about any of them match this
# repository. 5 of the settings are this repository's own choices: see tools/gen_apps.py.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    notifications.argoproj.io/subscribe.on-upgrade-healthy.slack: ""
    notifications.argoproj.io/subscribe.on-upgrade-degraded.slack: ""
    notifications.argoproj.io/subscribe.on-upgrade-failed.slack: ""
    notifications.argoproj.io/subscribe.on-upgrade-stuck.slack: ""
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server
    chart: metrics-server
    targetRevision: 3.12.2
    helm:
      valuesObject:
        image:
          pullPolicy: IfNotPresent
        imagePullSecrets: []
        nameOverride: ''
        fullnameOverride: ''
        serviceAccount:
          create: true
          annotations: {}
          name: ''
          secrets: []
        rbac:
          create: true
          pspEnabled: false
        apiService:
          create: true
          annotations: {}
          insecureSkipTLSVerify: true
          caBundle: ''
        commonLabels: {}
        podLabels: {}
        podAnnotations: {}
        podSecurityContext: {}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
        priorityClassName: system-cluster-critical
        containerPort: 10250
        hostNetwork:
          enabled: false
        replicas: 1
        revisionHistoryLimit: null
        updateStrategy: {}
        podDisruptionBudget:
          enabled: false
          minAvailable: null
          maxUnavailable: null
        defaultArgs:
        - --cert-dir=/tmp
        - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
        - --kubelet-use-node-status-port
        - --metric-resolution=15s
        args:
        - --kubelet-insecure-tls
        livenessProbe:
          httpGet:
            path: /livez
            port: https
            scheme: HTTPS
          initialDelaySeconds: 0
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: https
            scheme: HTTPS
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 3
        service:
          type: ClusterIP
          port: 443
          annotations: {}
          labels: {}
        addonResizer:
          enabled: false
          image: {}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
              - ALL
          resources:
            requests:
              cpu: 40m
              memory: 25Mi
            limits:
              cpu: 40m
              memory: 25Mi
          nanny:
            cpu: 0m
            extraCpu: 1m
            memory: 0Mi
            extraMemory: 2Mi
            minClusterSize: 100
            pollPeriod: 300000
            threshold: 5
        metrics:
          enabled: true
        serviceMonitor:
          enabled: false
          additionalLabels: {}
          interval: 1m
          scrapeTimeout: 10s
          metricRelabelings: []
          relabelings: []
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 96Mi
        extraVolumeMounts: []
        extraVolumes: []
        nodeSelector: {}
        tolerations: []
        affinity: {}
        topologySpreadConstraints: []
        dnsConfig: {}
        deploymentAnnotations: {}
        schedulerName: ''
        tmpVolume:
          emptyDir: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
