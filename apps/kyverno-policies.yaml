# Policies in Audit mode: they report, they never block.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    notifications.argoproj.io/subscribe.on-upgrade-degraded.slack: ""
    notifications.argoproj.io/subscribe.on-upgrade-failed.slack: ""
    notifications.argoproj.io/subscribe.on-upgrade-stuck.slack: ""
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/self-maintaining-api/demo-homelab-k3s.git
    targetRevision: main
    path: manifests/kyverno-policies
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true  # the CRDs come from another app; retried until they exist
    retry:
      limit: 10
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
