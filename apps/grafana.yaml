apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: 10.5.15
    helm:
      valuesObject:
        ingress:
          enabled: true
          ingressClassName: nginx
          annotations:
            cert-manager.io/cluster-issuer: demo-ca
          hosts:
            - grafana.192.168.178.20.nip.io
          tls:
            - secretName: grafana-tls
              hosts:
                - grafana.192.168.178.20.nip.io
        persistence:
          enabled: false  # dashboards come from this repo and grafana.com, nothing to keep
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                type: prometheus
                url: http://prometheus-server.monitoring.svc
                isDefault: true
        sidecar:
          dashboards:
            enabled: true  # also loads dashboards from ConfigMaps labelled grafana_dashboard in any namespace
            searchNamespace: ALL
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 96Mi
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: grafana-com
                folder: Stackat demo
                type: file
                options:
                  path: /var/lib/grafana/dashboards/grafana-com
        dashboards:
          grafana-com:
            node-exporter:
              gnetId: 1860
              revision: 37
              datasource: Prometheus
            blackbox:
              gnetId: 7587
              revision: 3
              datasource: Prometheus
            trivy-operator:
              gnetId: 17813
              revision: 2
              datasource: Prometheus
        resources:
          requests:
            cpu: 10m
            memory: 160Mi  # measured: about 190 MiB with the three dashboards
          limits:
            memory: 384Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
