# Every option of the grafana chart is set below, at the default of the version these values were written for
# (tools/chart-defaults/grafana.yaml; image tags left to the chart), so release notes about any of them match this
# repository. 27 of the settings are this repository's own choices: see tools/gen_apps.py.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    notifications.argoproj.io/subscribe.on-upgrade-healthy.slack: ""
    notifications.argoproj.io/subscribe.on-upgrade-degraded.slack: ""
    notifications.argoproj.io/subscribe.on-upgrade-failed.slack: ""
    notifications.argoproj.io/subscribe.on-upgrade-stuck.slack: ""
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: 10.2.0
    helm:
      valuesObject:
        global:
          imageRegistry: null
          imagePullSecrets: []
        rbac:
          create: true
          pspEnabled: false
          pspUseAppArmor: false
          namespaced: false
          extraRoleRules: []
          extraClusterRoleRules: []
        serviceAccount:
          create: true
          name: null
          nameTest: null
          labels: {}
          automountServiceAccountToken: false
        replicas: 1
        headlessService: false
        automountServiceAccountToken: true
        autoscaling:
          enabled: false
          minReplicas: 1
          maxReplicas: 5
          targetCPU: '60'
          targetMemory: ''
          behavior: {}
        podDisruptionBudget: {}
        deploymentStrategy:
          type: RollingUpdate
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 60
          timeoutSeconds: 30
          failureThreshold: 10
        image:
          registry: docker.io
          repository: grafana/grafana
          tag: ''
          sha: ''
          pullPolicy: IfNotPresent
          pullSecrets: []
        testFramework:
          enabled: true
          image:
            registry: docker.io
            repository: bats/bats
          imagePullPolicy: IfNotPresent
          securityContext: {}
          containerSecurityContext: {}
          resources: {}
        dnsPolicy: null
        dnsConfig: {}
        securityContext:
          runAsNonRoot: true
          runAsUser: 472
          runAsGroup: 472
          fsGroup: 472
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        createConfigmap: true
        extraConfigmapMounts: []
        extraEmptyDirMounts: []
        extraLabels: {}
        downloadDashboardsImage:
          registry: docker.io
          repository: curlimages/curl
          sha: ''
          pullPolicy: IfNotPresent
        downloadDashboards:
          env: {}
          envFromSecret: ''
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            seccompProfile:
              type: RuntimeDefault
          envValueFrom: {}
        podPortName: grafana
        gossipPortName: gossip
        service:
          enabled: true
          type: ClusterIP
          ipFamilyPolicy: ''
          ipFamilies: []
          loadBalancerIP: ''
          loadBalancerClass: ''
          loadBalancerSourceRanges: []
          port: 80
          targetPort: 3000
          annotations: {}
          labels: {}
          portName: service
          appProtocol: ''
          sessionAffinity: ''
        serviceMonitor:
          enabled: false
          path: /metrics
          labels: {}
          interval: 30s
          scheme: http
          tlsConfig: {}
          scrapeTimeout: 30s
          relabelings: []
          metricRelabelings: []
          basicAuth: {}
          targetLabels: []
        extraExposePorts: []
        hostAliases: []
        ingress:
          enabled: true
          annotations:
            cert-manager.io/cluster-issuer: demo-ca
          labels: {}
          path: /
          pathType: Prefix
          hosts:
          - grafana.demo-k3s.internal
          extraPaths: []
          tls:
          - secretName: grafana-tls
            hosts:
            - grafana.demo-k3s.internal
          ingressClassName: nginx
        route:
          main:
            enabled: false
            apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            annotations: {}
            labels: {}
            hostnames: []
            parentRefs: []
            matches:
            - path:
                type: PathPrefix
                value: /
            filters: []
            additionalRules: []
        resources:
          requests:
            cpu: 10m
            memory: 160Mi
          limits:
            memory: 384Mi
        nodeSelector: {}
        tolerations: []
        affinity: {}
        topologySpreadConstraints: []
        extraInitContainers: []
        extraContainers: ''
        extraContainerVolumes: []
        persistence:
          type: pvc
          enabled: false
          volumeName: ''
          accessModes:
          - ReadWriteOnce
          size: 10Gi
          finalizers:
          - kubernetes.io/pvc-protection
          extraPvcLabels: {}
          disableWarning: false
          inMemory:
            enabled: false
          lookupVolumeName: true
        initChownData:
          enabled: true
          image:
            registry: docker.io
            repository: library/busybox
            sha: ''
            pullPolicy: IfNotPresent
          resources: {}
          securityContext:
            readOnlyRootFilesystem: false
            runAsNonRoot: false
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              add:
              - CHOWN
              drop:
              - ALL
        adminUser: admin
        admin:
          existingSecret: ''
          userKey: admin-user
          passwordKey: admin-password
        env: {}
        envValueFrom: {}
        envFromSecret: ''
        envRenderSecret: {}
        envFromSecrets: []
        envFromConfigMaps: []
        enableServiceLinks: true
        extraSecretMounts: []
        extraVolumeMounts: []
        extraVolumes: []
        lifecycleHooks: {}
        plugins: []
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
            - name: Prometheus
              type: prometheus
              url: http://prometheus-server.monitoring.svc
              isDefault: true
        alerting: {}
        notifiers: {}
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
            - name: grafana-com
              folder: Stackat demo
              type: file
              options:
                path: /var/lib/grafana/dashboards/grafana-com
        defaultCurlOptions: -skf
        dashboards:
          grafana-com:
            node-exporter:
              gnetId: 1860
              revision: 37
              datasource: Prometheus
            blackbox:
              gnetId: 7587
              revision: 3
              datasource: Prometheus
            trivy-operator:
              gnetId: 17813
              revision: 2
              datasource: Prometheus
        dashboardsConfigMaps: {}
        grafana.ini:
          paths:
            data: /var/lib/grafana/
            logs: /var/log/grafana
            plugins: /var/lib/grafana/plugins
            provisioning: /etc/grafana/provisioning
          analytics:
            check_for_updates: true
          log:
            mode: console
          grafana_net:
            url: https://grafana.net
          server:
            domain: '{{ if (and .Values.ingress.enabled .Values.ingress.hosts) }}{{ tpl (.Values.ingress.hosts | first) . }}{{ else }}''''{{ end }}'
        ldap:
          enabled: false
          existingSecret: ''
          config: ''
        shareProcessNamespace: false
        smtp:
          existingSecret: ''
          userKey: user
          passwordKey: password
        sidecar:
          image:
            registry: quay.io
            repository: kiwigrid/k8s-sidecar
            sha: ''
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            seccompProfile:
              type: RuntimeDefault
          enableUniqueFilenames: false
          readinessProbe: {}
          livenessProbe: {}
          alerts:
            enabled: false
            env: {}
            envValueFrom: {}
            label: grafana_alert
            labelValue: ''
            searchNamespace: null
            watchMethod: WATCH
            resource: both
            resourceName: ''
            reloadURL: http://localhost:3000/api/admin/provisioning/alerting/reload
            script: null
            skipReload: false
            initAlerts: false
            extraMounts: []
            sizeLimit: ''
          dashboards:
            enabled: true
            env: {}
            envValueFrom: {}
            SCProvider: true
            label: grafana_dashboard
            labelValue: ''
            folder: /tmp/dashboards
            defaultFolderName: null
            searchNamespace: ALL
            watchMethod: WATCH
            resource: both
            folderAnnotation: null
            resourceName: ''
            reloadURL: http://localhost:3000/api/admin/provisioning/dashboards/reload
            script: null
            skipReload: false
            initDashboards: false
            provider:
              name: sidecarProvider
              orgid: 1
              folder: ''
              folderUid: ''
              type: file
              disableDelete: false
              allowUiUpdates: false
              foldersFromFilesStructure: false
            extraMounts: []
            sizeLimit: ''
          datasources:
            enabled: false
            env: {}
            envValueFrom: {}
            label: grafana_datasource
            labelValue: ''
            searchNamespace: null
            watchMethod: WATCH
            resource: both
            resourceName: ''
            reloadURL: http://localhost:3000/api/admin/provisioning/datasources/reload
            script: null
            skipReload: false
            initDatasources: false
            extraMounts: []
            sizeLimit: ''
          plugins:
            enabled: false
            env: {}
            label: grafana_plugin
            labelValue: ''
            searchNamespace: null
            watchMethod: WATCH
            resource: both
            resourceName: ''
            reloadURL: http://localhost:3000/api/admin/provisioning/plugins/reload
            script: null
            skipReload: false
            initPlugins: false
            extraMounts: []
            sizeLimit: ''
          notifiers:
            enabled: false
            env: {}
            label: grafana_notifier
            labelValue: ''
            searchNamespace: null
            watchMethod: WATCH
            resource: both
            resourceName: ''
            reloadURL: http://localhost:3000/api/admin/provisioning/notifications/reload
            script: null
            skipReload: false
            initNotifiers: false
            extraMounts: []
            sizeLimit: ''
        namespaceOverride: ''
        revisionHistoryLimit: 10
        imageRenderer:
          deploymentStrategy: {}
          enabled: false
          replicas: 1
          autoscaling:
            enabled: false
            minReplicas: 1
            maxReplicas: 5
            targetCPU: '60'
            targetMemory: ''
            behavior: {}
          serverURL: ''
          renderingCallbackURL: ''
          image:
            registry: docker.io
            repository: grafana/grafana-image-renderer
            sha: ''
            pullSecrets: []
            pullPolicy: Always
          env:
            HTTP_HOST: 0.0.0.0
            XDG_CONFIG_HOME: /tmp/.chromium
            XDG_CACHE_HOME: /tmp/.chromium
          envValueFrom: {}
          serviceAccountName: ''
          automountServiceAccountToken: false
          securityContext: {}
          containerSecurityContext:
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
              - ALL
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          podAnnotations: {}
          hostAliases: []
          priorityClassName: ''
          service:
            enabled: true
            portName: http
            port: 8081
            targetPort: 8081
            appProtocol: ''
          serviceMonitor:
            enabled: false
            path: /metrics
            labels: {}
            interval: 1m
            scheme: http
            tlsConfig: {}
            scrapeTimeout: 30s
            relabelings: []
            targetLabels: []
          grafanaProtocol: http
          grafanaSubPath: ''
          podPortName: http
          revisionHistoryLimit: 10
          networkPolicy:
            limitIngress: true
            limitEgress: false
            extraIngressSelectors: []
          resources: {}
          nodeSelector: {}
          tolerations: []
          affinity: {}
          extraConfigmapMounts: []
          extraSecretMounts: []
          extraVolumeMounts: []
          extraVolumes: []
        networkPolicy:
          enabled: false
          ingress: true
          allowExternal: true
          explicitNamespacesSelector: {}
          egress:
            enabled: false
            blockDNSResolution: false
            ports: []
            to: []
        enableKubeBackwardCompatibility: false
        useStatefulSet: false
        extraObjects: []
        assertNoLeakedSecrets: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
