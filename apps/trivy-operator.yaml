apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://aquasecurity.github.io/helm-charts
    chart: trivy-operator
    targetRevision: 0.36.0
    helm:
      valuesObject:
        # Scans the images that actually run and keeps a VulnerabilityReport per workload, with per-CVE metrics in
        # Prometheus: the cluster's own answer to "which of these CVEs affect us", next to what Stackat's issues say.
        operator:
          scanJobsConcurrentLimit: 1  # one scan at a time on a small node
          scanJobTTL: 10m
          builtInTrivyServer: true  # one vulnerability database for all scans, not one download per scan
          vulnerabilityScannerEnabled: true
          sbomGenerationEnabled: true
          configAuditScannerEnabled: true
          rbacAssessmentScannerEnabled: true
          exposedSecretScannerEnabled: true
          infraAssessmentScannerEnabled: false
          clusterComplianceEnabled: false
          metricsVulnIdEnabled: true
          metricsFindingsEnabled: true
          metricsConfigAuditInfo: true
        trivy:
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 512Mi
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: trivy-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
