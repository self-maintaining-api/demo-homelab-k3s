# Installed first by scripts/vm-bootstrap.sh (same release name), then adopted by this Application.
# Every option of the argo-cd chart is set below, at the default of the version these values were written for
# (tools/chart-defaults/argo-cd.yaml; images left to the chart), so release notes about any of them match this
# repository. 50 of the settings are this repository's own choices: see tools/gen_apps.py.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    notifications.argoproj.io/subscribe.on-upgrade-healthy.slack: ""
    notifications.argoproj.io/subscribe.on-upgrade-degraded.slack: ""
    notifications.argoproj.io/subscribe.on-upgrade-failed.slack: ""
    notifications.argoproj.io/subscribe.on-upgrade-stuck.slack: ""
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 10.8.4
    helm:
      releaseName: argocd
      valuesObject:
        nameOverride: argocd
        fullnameOverride: ''
        namespaceOverride: ''
        kubeVersionOverride: ''
        apiVersionOverrides: {}
        createAggregateRoles: false
        createClusterRoles: true
        openshift:
          enabled: false
        crds:
          install: true
          keep: true
          annotations:
            argocd.argoproj.io/sync-options: ServerSideApply=true
          additionalLabels: {}
        global:
          domain: argocd.example.com
          runtimeClassName: ''
          additionalLabels: {}
          revisionHistoryLimit: 3
          image:
            imagePullPolicy: IfNotPresent
          imagePullSecrets: []
          logging:
            format: text
            level: info
          statefulsetAnnotations: {}
          statefulsetLabels: {}
          deploymentAnnotations: {}
          deploymentLabels: {}
          podAnnotations: {}
          podLabels: {}
          addPrometheusAnnotations: false
          securityContext: {}
          hostAliases: []
          dualStack:
            ipFamilyPolicy: ''
            ipFamilies: []
          networkPolicy:
            create: true
            defaultDenyIngress: false
          priorityClassName: ''
          nodeSelector:
            kubernetes.io/os: linux
          tolerations: []
          affinity:
            podAntiAffinity: soft
            nodeAffinity:
              type: hard
              matchExpressions: []
          topologySpreadConstraints: []
          deploymentStrategy: {}
          env: []
          extraVolumes: []
          extraVolumeMounts: []
          certificateAnnotations: {}
        configs:
          cm:
            create: true
            annotations: {}
            application.instanceLabelKey: argocd.argoproj.io/instance
            application.sync.impersonation.enabled: false
            exec.enabled: true
            admin.enabled: true
            timeout.reconciliation: 180s
            timeout.reconciliation.jitter: 60s
            timeout.hard.reconciliation: 0s
            statusbadge.enabled: true
            resource.customizations.ignoreResourceUpdates.all: |
              jsonPointers:
                - /status
            resource.customizations.ignoreResourceUpdates.argoproj.io_Application: |
              jqPathExpressions:
                - '.metadata.annotations."notified.notifications.argoproj.io"'
                - '.metadata.annotations."argocd.argoproj.io/refresh"'
                - '.metadata.annotations."argocd.argoproj.io/hydrate"'
                - '.operation'
            resource.customizations.ignoreResourceUpdates.argoproj.io_Rollout: |
              jqPathExpressions:
                - '.metadata.annotations."notified.notifications.argoproj.io"'
            resource.customizations.ignoreResourceUpdates.autoscaling_HorizontalPodAutoscaler: |
              jqPathExpressions:
                - '.metadata.annotations."autoscaling.alpha.kubernetes.io/behavior"'
                - '.metadata.annotations."autoscaling.alpha.kubernetes.io/conditions"'
                - '.metadata.annotations."autoscaling.alpha.kubernetes.io/metrics"'
                - '.metadata.annotations."autoscaling.alpha.kubernetes.io/current-metrics"'
            resource.customizations.ignoreResourceUpdates.ConfigMap: |
              jqPathExpressions:
                # Ignore the cluster-autoscaler status
                - '.metadata.annotations."cluster-autoscaler.kubernetes.io/last-updated"'
                # Ignore the annotation of the legacy Leases election
                - '.metadata.annotations."control-plane.alpha.kubernetes.io/leader"'
            resource.customizations.ignoreResourceUpdates.apps_ReplicaSet: |
              jqPathExpressions:
                - '.metadata.annotations."deployment.kubernetes.io/desired-replicas"'
                - '.metadata.annotations."deployment.kubernetes.io/max-replicas"'
                - '.metadata.annotations."rollout.argoproj.io/desired-replicas"'
            resource.customizations.ignoreResourceUpdates.discovery.k8s.io_EndpointSlice: |
              jsonPointers:
                - /metadata
                - /endpoints
                - /ports
            resource.customizations.ignoreResourceUpdates.Endpoints: |
              jsonPointers:
                - /metadata
                - /subsets
            resource.exclusions: |
              ### Network resources created by the Kubernetes control plane and excluded to reduce the number of watched events and UI clutter
              - apiGroups:
                - ''
                - discovery.k8s.io
                kinds:
                - Endpoints
                - EndpointSlice
              ### Internal Kubernetes resources excluded reduce the number of watched events
              - apiGroups:
                - coordination.k8s.io
                kinds:
                - Lease
              ### Internal Kubernetes Authz/Authn resources excluded reduce the number of watched events
              - apiGroups:
                - authentication.k8s.io
                - authorization.k8s.io
                kinds:
                - SelfSubjectReview
                - TokenReview
                - LocalSubjectAccessReview
                - SelfSubjectAccessReview
                - SelfSubjectRulesReview
                - SubjectAccessReview
              ### Intermediate Certificate Request excluded reduce the number of watched events
              - apiGroups:
                - certificates.k8s.io
                kinds:
                - CertificateSigningRequest
              - apiGroups:
                - cert-manager.io
                kinds:
                - CertificateRequest
              ### Cilium internal resources excluded reduce the number of watched events and UI Clutter
              - apiGroups:
                - cilium.io
                kinds:
                - CiliumIdentity
                - CiliumEndpoint
                - CiliumEndpointSlice
              ### Kyverno intermediate and reporting resources excluded reduce the number of watched events and improve performance
              - apiGroups:
                - kyverno.io
                - reports.kyverno.io
                - wgpolicyk8s.io
                kinds:
                - PolicyReport
                - ClusterPolicyReport
                - EphemeralReport
                - ClusterEphemeralReport
                - AdmissionReport
                - ClusterAdmissionReport
                - BackgroundScanReport
                - ClusterBackgroundScanReport
