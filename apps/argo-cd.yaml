# Installed first by scripts/vm-bootstrap.sh (same release name), then adopted by this Application.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 10.8.4
    helm:
      releaseName: argocd
      valuesObject:
        # Argo CD manages itself: a merged pull request that bumps this version upgrades Argo CD.
        dex:
          enabled: false  # no SSO on a LAN demo; the admin user signs in
        notifications:
          enabled: true
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 96Mi
        configs:
          params:
            server.insecure: true  # TLS ends at ingress-nginx
            controller.status.processors: 5
            controller.operation.processors: 2
            reposerver.parallelism.limit: 2
          cm:
            timeout.reconciliation: 180s
            statusbadge.enabled: true
            exec.enabled: true
            kustomize.buildOptions: --enable-helm
            # trivy-operator writes a report per workload and rewrites them on every scan; Argo CD manages none of them,
            # and watching them all crashed the controller (out of memory). Kyverno's reports are in the chart's defaults.
            resourceExclusionsAdditional:
              - apiGroups: [aquasecurity.github.io]
                kinds: ["*"]
                clusters: ["*"]
        controller:
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi  # measured: over 512 MiB with ~20 apps and the reports above
          metrics:
            enabled: true
            service:
              annotations:
                prometheus.io/scrape: "true"
                prometheus.io/port: "8082"
        repoServer:
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 384Mi
          metrics:
            enabled: true
        server:
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 192Mi
          metrics:
            enabled: true
          ingress:
            enabled: true
            ingressClassName: nginx
            hostname: argocd.demo-k3s.internal
            annotations:
              cert-manager.io/cluster-issuer: demo-ca
            tls: true
        applicationSet:
          replicas: 1
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 128Mi
        redis:
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 96Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
