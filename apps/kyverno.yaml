# Every option of the kyverno chart is set below, at the default of the version these values were written for
# (tools/chart-defaults/kyverno.yaml; image tags left to the chart), so release notes about any of them match this
# repository. 19 of the settings are this repository's own choices: see tools/gen_apps.py.
apiVersion: argoproj.io/v1alpha1
kind: Application
