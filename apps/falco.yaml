# Pinned one major behind (8 -> 9): a migration for Stackat to describe.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://falcosecurity.github.io/charts
    chart: falco
    targetRevision: 8.0.5
    helm:
      valuesObject:
        # Runtime detection with the modern eBPF probe (no kernel module). Alerts go to its log: kubectl -n falco logs ds/falco
        driver:
          kind: modern_ebpf
        falco:
          json_output: true
        metrics:
          enabled: true
        falcosidekick:
          enabled: false
        resources:
          requests:
            cpu: 20m
            memory: 160Mi
          limits:
            memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: falco
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
